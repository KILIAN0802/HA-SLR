# Thư mục lưu kết quả huấn luyện
work_dir: ./work_dir/400VSL/Bone_Motion/baseline
Experiment_name: 400VSL/Bone_Motion
joint_sign: processed
joint_type: 27_direct
splits: [test]

# Wandb
use_wandb: True
wandb_project: "HA-SLR-CEGCN"
wandb_run_name: "Bone_Motion_400VSL"

# Cấu hình Feeder
feeder: feeders.feeder_cvpr.Feeder
train_feeder_args:
  data_path: data/data/400VSL/processed/27_direct/train_data_bone_motion.npy
  label_path: data/data/400VSL/processed/27_direct/train_label.pkl
  window_size: 150
  debug: False
  use_jdma: True
val_feeder_args:
  data_path: data/data/400VSL/processed/27_direct/val_data_bone_motion.npy
  label_path: data/data/400VSL/processed/27_direct/val_label.pkl
  window_size: 150
  debug: False
test_feeder_args:
  data_path: data/data/400VSL/processed/27_direct/test_data_bone_motion.npy
  label_path: data/data/400VSL/processed/27_direct/test_label.pkl
  window_size: 150
  debug: False

# Cấu hình Mô hình
model: model.hand_aware_sl_lgcn.Model
model_args:
  num_class: 400
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  A_hands: graph.sign_27_A_hands.Graph
  graph_args:
    labeling_mode: spatial

# Cấu hình Huấn luyện
phase: train
device: [0]
batch_size: 32
train_base_lr: 0.1
test_base_lr: 0.1
step: [50, 100, 150]
num_epoch: 200
