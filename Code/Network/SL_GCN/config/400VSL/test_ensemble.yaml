# Joint
joint_model: model.hand_aware_sl_lgcn.Model
joint_model_args:
  num_class: 400
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  A_hands: graph.sign_27_A_hands.Graph
  graph_args:
    labeling_mode: spatial
joint_weights: null
joint_feeder: feeders.feeder_cvpr.Feeder
joint_test_feeder_args:
  data_path: data/data/400VSL/processed/27_direct/test_data_joint.npy
  label_path: data/data/400VSL/processed/27_direct/test_label.pkl
  window_size: 150

